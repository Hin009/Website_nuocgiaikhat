server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: drink-store-api
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/beverage_store}
    username: ${DB_USERNAME:drink_user}
    password: ${DB_PASSWORD:change_me_local}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    deserialization:
      fail-on-unknown-properties: true
app:
  bank-transfer:
    bank-id: ${BANK_TRANSFER_BANK_ID:}
    bank-name: ${BANK_TRANSFER_BANK_NAME:}
    account-number: ${BANK_TRANSFER_ACCOUNT_NUMBER:}
    account-name: ${BANK_TRANSFER_ACCOUNT_NAME:}
  password-reset:
    mail-enabled: ${MAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  token-hours: 8
  shipping-fee: 0
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
