name: doan_cnpm_26

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beverage_store}
      POSTGRES_USER: ${DB_USERNAME:-drink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - beverage_13uc_data:/var/lib/postgresql/data
      - ./database/beverage_store_13UC_HOAN_CHINH.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-beverage_store}
      DB_USERNAME: ${DB_USERNAME:-drink_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8080
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - product_images:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  beverage_13uc_data:
  product_images:
